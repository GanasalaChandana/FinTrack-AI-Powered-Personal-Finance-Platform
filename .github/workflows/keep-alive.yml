name: Keep backend awake

# Render's free tier puts the API to sleep after 15 minutes without traffic, and
# the next visitor waits ~70 s for it to start. A ping every 10 minutes keeps it
# warm. This uses no Render build minutes; one always-on service is ~730 instance
# hours a month, inside the free 750. (GitHub may run scheduled jobs a few minutes
# late, and disables them after 60 days without commits to the repo.)
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping the API health check
        env:
          API_URL: ${{ secrets.E2E_API_URL || 'https://fintrack-api-e9ee.onrender.com' }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$API_URL/actuator/health") || true
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::Backend did not answer the keep-alive ping"
