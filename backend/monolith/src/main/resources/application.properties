# =====================
# Server
# =====================
server.port=8080
spring.application.name=fintrack-monolith

# =====================
# File Upload Limits
# =====================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# =====================
# Database (use env vars on Render)
# =====================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway migrations are the only thing that change the schema. Hibernate just checks
# the tables match the entities and refuses to start if they don't.
# Escape hatch: set JPA_DDL_AUTO=update in the host's environment (no code change).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
# No lazy loading while JSON is written: queries belong in services/transactions
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

# =====================
# Flyway
# =====================
# An existing database (created by Hibernate) is baselined at version 1 and left
# untouched; a brand-new database gets V1__baseline_schema.sql.
# Set FLYWAY_ENABLED=false on the host to switch it off without a code change.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.placeholders.text_type=TEXT

# =====================
# JWT
# =====================
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# =====================
# Google OAuth
# =====================
google.client.id=${GOOGLE_CLIENT_ID:}
google.oauth.client-id=${GOOGLE_CLIENT_ID:}

# =====================
# Mail (optional)
# =====================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =====================
# Actuator / Health
# =====================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# =====================
# Jackson
# =====================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# =====================
# Bean overriding
# =====================
spring.main.allow-bean-definition-overriding=true

# =====================
# Alert Rules
# =====================
alert.rules.high-amount-threshold=1000
alert.rules.unusual-spending-multiplier=2.0
alert.rules.budget-warning-percentage=80
alert.rules.max-alerts-per-window=10
alert.rules.rate-limit-window-seconds=3600

# =====================
# =====================
# Internal Service URLs (monolith - all on same port)
# =====================

# Session cookies are Secure (HTTPS only; browsers also allow them on localhost)
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}

# Public URL of the web app (links in emails) and the From address for emails
app.base-url=${APP_BASE_URL:https://fintrack-liart.vercel.app}
app.mail.from=${MAIL_FROM:}
