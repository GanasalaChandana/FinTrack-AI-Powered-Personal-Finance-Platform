# Runs the same stack that's deployed: PostgreSQL + Spring Boot monolith + Next.js.
#
#   JWT_SECRET=$(openssl rand -base64 48) docker compose up --build
#
# → app on http://localhost:3000, API on http://localhost:8080

services:
  postgres:
    image: postgres:15-alpine
    container_name: fintrack-postgres
    environment:
      POSTGRES_DB: fintrack
      POSTGRES_USER: ${DB_USER:-fintrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fintrack}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fintrack} -d fintrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/monolith
    container_name: fintrack-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/fintrack
      DB_USERNAME: ${DB_USER:-fintrack}
      DB_PASSWORD: ${DB_PASSWORD:-fintrack}
      # Required — the server refuses to start without a strong secret
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET, e.g. JWT_SECRET=$(openssl rand -base64 48)}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/web
      args:
        # Baked into the browser bundle at build time — must be reachable from the browser
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: fintrack-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
