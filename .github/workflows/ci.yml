name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # run by hand to build and deploy the backend image

jobs:

  # ── 1. Backend: compile + run all tests ─────────────────────────────────────
  backend-test:
    name: Backend Tests (Java 17)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -f backend/monolith/pom.xml test

      - name: Upload Surefire report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-report
          path: backend/monolith/target/surefire-reports/

  # ── 1b. Backend image: build on GitHub, deploy on Render ────────────────────
  # Render deploys this prebuilt image, so deploys use no Render build minutes.
  backend-image:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    needs: [ backend-test ]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history, to diff against the commit before this push

      - name: Check for backend changes
        id: changes
        run: |
          # Compare with the commit before this push (not just HEAD~1): a push can carry
          # several commits, and the backend change may not be the last one.
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             && git diff --quiet "$BEFORE" HEAD -- backend/monolith; then
            echo "backend=false" >> "$GITHUB_OUTPUT"
          else
            echo "backend=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Image name
        if: steps.changes.outputs.backend == 'true'
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fintrack-monolith" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: steps.image.outputs.name

      - uses: docker/login-action@v4
        if: steps.image.outputs.name
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.image.outputs.name
        uses: docker/build-push-action@v7
        with:
          context: backend/monolith
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy
        if: steps.image.outputs.name
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set - skipping deploy"; exit 0
          fi
          curl -fsS -X POST "$HOOK&imgURL=$(printf %s "$IMAGE" | jq -sRr @uri)" > /dev/null
          echo "Render deploy triggered for $IMAGE"

  # ── 2. Frontend: type-check ──────────────────────────────────────────────────
  frontend-typecheck:
    name: Frontend Type Check (Next.js 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web   # all steps run inside frontend/web

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  # ── 2b. Frontend: unit tests (Vitest) ────────────────────────────────────────
  frontend-unit:
    name: Frontend Unit Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # ── 3. E2E smoke tests (Playwright) ─────────────────────────────────────────
  e2e:
    name: E2E Smoke Tests (Playwright)
    runs-on: ubuntu-24.04   # Playwright 1.59 has no browsers for ubuntu-26.04 (now ubuntu-latest)
    # A healthy run takes ~5 min. When the live site is mid-deploy (e.g. new frontend,
    # old backend) every test fails and retries; stop early instead of running 45 min.
    timeout-minutes: 20
    needs: [ backend-test, frontend-typecheck, frontend-unit ]   # only run if all pass
    defaults:
      run:
        working-directory: frontend/web   # all steps run inside frontend/web

    env:
      BASE_URL:      ${{ secrets.E2E_BASE_URL || 'https://fintrack-liart.vercel.app' }}
      API_URL:       ${{ secrets.E2E_API_URL  || 'https://fintrack-api-e9ee.onrender.com' }}
      TEST_EMAIL:    ${{ secrets.E2E_TEST_EMAIL    }}
      TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Render's free tier sleeps when idle; wake the API first so a cold start
      # isn't reported as a test failure (Playwright also retries twice on CI).
      - name: Wake the backend
        run: |
          for i in $(seq 1 30); do
            curl -sf --max-time 10 "$API_URL/actuator/health" && exit 0
            echo "waiting for $API_URL ($i/30)"; sleep 10
          done
          echo "::error::Backend at $API_URL did not respond within 5 minutes"; exit 1

      - name: Run smoke tests (desktop + phone Chromium)
        run: npx playwright test --project=chromium --project=mobile-chrome

      # The report contains page snapshots, including the test account's typed
      # credentials, so never publish it from a public repo.
      - name: Upload Playwright report
        if: false
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/web/playwright-report/
          retention-days: 7
